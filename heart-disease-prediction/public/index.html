<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>❤️ Heart Disease Prediction</h1>
            <p>Machine Learning Based Prediction System</p>
        </div>

        <form id="predictionForm"
        onsubmit="predictDisease(event)">

            <div class="form-grid">

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" required>
                </div>

                <div class="form-group">
                    <label>Sex</label>
                    <select id="sex" required>
                        <option value="">Select</option>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Chest Pain Type</label>
                    <select id="cp" required>
                        <option value="">Select</option>
                        <option value="0">Typical Angina</option>
                        <option value="1">Atypical Angina</option>
                        <option value="2">Non-Anginal Pain</option>
                        <option value="3">Asymptomatic</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Resting Blood Pressure</label>
                    <input type="number" id="trestbps" required>
                </div>

                <div class="form-group">
                    <label>Cholesterol</label>
                    <input type="number" id="chol" required>
                </div>

                <div class="form-group">
                    <label>Fasting Blood Sugar</label>
                    <select id="fbs" required>
                        <option value="">Select</option>
                        <option value="1">Greater than 120 mg/dl</option>
                        <option value="0">Less than or equal to 120 mg/dl</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Resting ECG</label>
                    <select id="restecg" required>
                        <option value="">Select</option>
                        <option value="0">Normal</option>
                        <option value="1">ST-T Abnormality</option>
                        <option value="2">Left Ventricular Hypertrophy</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Maximum Heart Rate</label>
                    <input type="number" id="thalach" required>
                </div>

                <div class="form-group">
                    <label>Exercise Induced Angina</label>
                    <select id="exang" required>
                        <option value="">Select</option>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ST Depression (Oldpeak)</label>
                    <input type="number" step="0.1" id="oldpeak" required>
                </div>

                <div class="form-group">
                    <label>Slope</label>
                    <select id="slope" required>
                        <option value="">Select</option>
                        <option value="0">Upsloping</option>
                        <option value="1">Flat</option>
                        <option value="2">Downsloping</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Number of Major Vessels (CA)</label>
                    <select id="ca" required>
                        <option value="">Select</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Thal</label>
                    <select id="thal" required>
                        <option value="">Select</option>
                        <option value="0">Normal</option>
                        <option value="1">Fixed Defect</option>
                        <option value="2">Reversible Defect</option>
                        <option value="3">Other</option>
                    </select>
                </div>

            </div>

            <button type="submit">
                Predict Heart Disease
            </button>

        </form>

        <div id="loading" class="loading">
            Predicting...
        </div>

        <div id="result" class="result"></div>

        <div class="note">
            <strong>Note:</strong> This application is for educational purposes
            and should not be used as a medical diagnosis.
        </div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
